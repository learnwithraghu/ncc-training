apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbital-relay
  labels:
    app: orbital-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbital-relay
  template:
    metadata:
      labels:
        app: orbital-relay
    spec:
      containers:
        - name: web
          image: learnwithraghu/ncc-workshop:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: STATION_NAME
              valueFrom:
                configMapKeyRef:
                  name: station-config
                  key: STATION_NAME
            - name: STATION_REGION
              valueFrom:
                configMapKeyRef:
                  name: station-config
                  key: STATION_REGION
            - name: RELAY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: station-secret
                  key: RELAY_API_TOKEN
