apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbital-relay
  labels:
    app: orbital-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbital-relay
  template:
    metadata:
      labels:
        app: orbital-relay
    spec:
      containers:
        - name: web
          image: <ECR_REGISTRY>/orbital-relay:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
