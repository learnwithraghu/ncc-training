apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbital-relay
  labels:
    app: orbital-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbital-relay
  template:
    metadata:
      labels:
        app: orbital-relay
      annotations:
        orbital-relay/site-version: "v1"
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
      volumes:
        - name: site
          configMap:
            name: orbital-site
