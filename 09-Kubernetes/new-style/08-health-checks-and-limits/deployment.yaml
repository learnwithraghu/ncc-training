apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbital-relay
  labels:
    app: orbital-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbital-relay
  template:
    metadata:
      labels:
        app: orbital-relay
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "150m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
      volumes:
        - name: site
          configMap:
            name: orbital-site
