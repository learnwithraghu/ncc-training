# Lab values for Signal Forge (official jenkins/jenkins chart)
# Keep this small so training clusters come up cleanly and tear down easily.

controller:
  admin:
    username: admin
    password: "Passw0rd"
  serviceType: NodePort
  nodePort: 32080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

persistence:
  enabled: false
