apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-search
  labels:
    app: document-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-search
  template:
    metadata:
      labels:
        app: document-search
    spec:
      containers:
        - name: document-search
          image: <YOUR_ECR_REGISTRY>/document-search:latest
          ports:
            - containerPort: 8501
              name: http
          env:
            - name: STREAMLIT_SERVER_FILE_WATCHER_TYPE
              value: "none"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
