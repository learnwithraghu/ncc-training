---
- name: Use variables and templates
  hosts: web
  become: true
  vars:
    app_name: demo-app
    app_port: 8080
  tasks:
    - name: Write a config file from variables
      ansible.builtin.copy:
        dest: /tmp/{{ app_name }}.conf
        content: |
          name={{ app_name }}
          port={{ app_port }}
