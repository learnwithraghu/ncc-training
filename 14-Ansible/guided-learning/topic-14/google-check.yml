---
- name: Verify www.google.com is reachable from every web host
  hosts: web
  become: true
  tasks:
    - name: Request www.google.com
      ansible.builtin.uri:
        url: https://www.google.com
        status_code: 200
        return_content: false
      register: google_check
      ignore_errors: true

    - name: Verify the request succeeded
      ansible.builtin.assert:
        that:
          - google_check.status is defined
          - google_check.status == 200
        fail_msg: "www.google.com is NOT reachable from {{ inventory_hostname }}"
        success_msg: "www.google.com is reachable from {{ inventory_hostname }}"
